name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes (excluindo integração)
        run: pytest tests/ -m "not integration" --cov=src --cov-report=term-missing

  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t passos-magicos:ci-${{ github.sha }} .
